name: Build & Release Windows x86

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      QTDIR: C:\Qt\5.15.2\msvc2019

    steps:
      - name: Checkout
        shell: bash
        run: |
          git clone --recurse-submodules \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            .
          git fetch --tags

      - name: Initialize submodules (fallback)
        shell: bash
        run: |
          if [ ! -f deps/singleapplication/CMakeLists.txt ]; then
            echo "SingleApplication submodule missing, cloning manually..."
            rm -rf deps/singleapplication
            git clone https://github.com/itay-grudev/SingleApplication deps/singleapplication
          fi
          # deps/libmpv is populated by the 'Setup libmpv' step below (not a submodule)

      - name: Setup libmpv for Windows x86 (headers + DLL + MSVC .lib)
        shell: pwsh
        run: |
          # Ivshti/libmpv is 9 years old and missing render API headers.
          # Download the latest mpv-dev-i686 from shinchiro/mpv-winbuild-cmake
          # (the standard source for mpv Windows builds, LGPL licensed).
          $release = Invoke-RestMethod "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"

          $devAsset = $release.assets |
            Where-Object { $_.name -match '^mpv-dev-i686-' } |
            Select-Object -First 1
          if (-not $devAsset) { throw "mpv-dev-i686 asset not found in latest release" }

          Write-Host "Downloading dev pkg: $($devAsset.name)"
          Invoke-WebRequest $devAsset.browser_download_url -OutFile mpv-dev-i686.7z

          $sz = "C:\Program Files\7-Zip\7z.exe"
          & $sz x mpv-dev-i686.7z -y -o"mpv-dev-pkg" | Out-Null

          # Copy headers
          New-Item -ItemType Directory -Force "deps\libmpv\include\mpv" | Out-Null
          $hFile = Get-ChildItem "mpv-dev-pkg" -Filter "client.h" -Recurse | Select-Object -First 1
          if (-not $hFile) { throw "client.h not found in dev package" }
          Copy-Item "$($hFile.DirectoryName)\*.h" "deps\libmpv\include\mpv\" -Force
          # qthelper.hpp is Qt-specific and not in shinchiro packages; fetch from Ivshti/libmpv
          Invoke-WebRequest "https://raw.githubusercontent.com/Ivshti/libmpv/master/include/mpv/qthelper.hpp" `
            -OutFile "deps\libmpv\include\mpv\qthelper.hpp"
          Write-Host "mpv headers:"; Get-ChildItem "deps\libmpv\include\mpv" | Select-Object -ExpandProperty Name

          # The dev package also contains libmpv-2.dll (and libmpv.dll.a for MinGW)
          New-Item -ItemType Directory -Force "deps\libmpv\win32" | Out-Null
          $dll = Get-ChildItem "mpv-dev-pkg" -Filter "*.dll" -Recurse |
            Where-Object { $_.Name -match '^libmpv' -or $_.Name -match '^mpv' } |
            Select-Object -First 1
          if (-not $dll) {
            Write-Host "DLL not found in dev pkg. Contents:"
            Get-ChildItem "mpv-dev-pkg" -Recurse | Select-Object -ExpandProperty FullName
            throw "mpv DLL not found in dev package"
          }
          Copy-Item $dll.FullName "deps\libmpv\win32\$($dll.Name)" -Force
          Copy-Item $dll.FullName "windows\$($dll.Name)" -Force
          Write-Host "mpv DLL: $($dll.Name)"
          echo "MPV_DLL_NAME=$($dll.Name)" >> $env:GITHUB_ENV

      - name: Generate mpv.lib (MSVC x86 import library from DLL exports)
        shell: pwsh
        run: |
          # mpv-dev-i686 has no .def file; generate one from the DLL exports using dumpbin
          $msvcBase = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC"
          $msvcVer  = (Get-ChildItem $msvcBase | Sort-Object Name -Descending | Select-Object -First 1).Name
          $dumpbin  = "$msvcBase\$msvcVer\bin\Hostx86\x86\dumpbin.exe"
          $libExe   = "$msvcBase\$msvcVer\bin\Hostx86\x86\lib.exe"

          $dllPath = "deps\libmpv\win32\$env:MPV_DLL_NAME"
          Write-Host "Extracting exports from: $dllPath"

          $dumpOut = & $dumpbin /exports $dllPath 2>&1
          $defLines = @("EXPORTS")
          foreach ($line in $dumpOut) {
            # dumpbin export line format:  "    N  hint   RVA   name"
            if ($line -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\w+)\s*$') {
              $defLines += "  $($Matches[1])"
            }
          }
          if ($defLines.Count -lt 2) { throw "No exports parsed from $dllPath" }
          $defLines | Set-Content "deps\libmpv\win32\mpv.def" -Encoding ASCII
          Write-Host "mpv.def: $($defLines.Count - 1) exports"

          & $libExe /def:"deps\libmpv\win32\mpv.def" /machine:x86 /out:"deps\libmpv\win32\mpv.lib" /nologo
          if ($LASTEXITCODE -ne 0) { throw "lib.exe failed with exit code $LASTEXITCODE" }
          Write-Host "mpv.lib generated at deps\libmpv\win32\mpv.lib"

      - name: Install Qt 5.15.2 (MSVC 2019 x86 + WebEngine) via aqtinstall
        shell: pwsh
        run: |
          pip install aqtinstall --quiet
          aqt install-qt windows desktop 5.15.2 win32_msvc2019 `
            --modules qtwebengine `
            --outputdir C:\Qt
          if (-not (Test-Path "C:\Qt\5.15.2\msvc2019\bin\qmake.exe")) {
            throw "Qt installation failed: qmake.exe not found"
          }
          Write-Host "Qt 5.15.2 ready at C:\Qt\5.15.2\msvc2019"

      - name: Install OpenSSL Win32
        shell: pwsh
        run: |
          # The runner pre-installs 64-bit OpenSSL; we need 32-bit libs for the x86 build.
          # Download the Win32 installer from slproweb (official OpenSSL for Windows binaries).
          $hashesUrl = 'https://raw.githubusercontent.com/slproweb/opensslhashes/master/win32_openssl_hashes.json'
          $files = (Invoke-RestMethod $hashesUrl).files
          # Pick the latest Win32 full (not Light) installer for OpenSSL 3.x
          $file = $files.psobject.properties.name |
            Where-Object { $_ -match '^Win32OpenSSL-3_\d+_\d+[a-z]?\.exe$' } |
            Sort-Object -Descending |
            Select-Object -First 1
          if (-not $file) {
            # Fall back to 1.1.1 if 3.x is not available
            $file = $files.psobject.properties.name |
              Where-Object { $_ -match '^Win32OpenSSL-1_1_1[a-z]+\.exe$' } |
              Sort-Object -Descending |
              Select-Object -First 1
          }
          if (-not $file) { throw "No suitable Win32 OpenSSL installer found" }
          $url = $files.$file.url
          Write-Host "Downloading $file from $url"
          Invoke-WebRequest $url -OutFile openssl_win32.exe
          Start-Process ./openssl_win32.exe -ArgumentList '/silent /verysilent /sp- /suppressmsgboxes /dir=C:\OpenSSL-Win32' -Wait
          Remove-Item openssl_win32.exe
          if (-not (Test-Path "C:\OpenSSL-Win32\include\openssl\ssl.h")) {
            throw "OpenSSL Win32 installation failed"
          }
          echo "OPENSSL_ROOT_DIR=C:\OpenSSL-Win32" >> $env:GITHUB_ENV
          Write-Host "OpenSSL Win32 installed at C:\OpenSSL-Win32"

      - name: Install addon dependencies
        run: cd "DualSubtitles AddOn" && npm install --production
        shell: cmd

      - name: Compute next version
        id: version
        shell: bash
        run: |
          BASE=$(sed -E '/^project\(/!d;s/^.*VERSION "([^"]+)".*$/\1/g' CMakeLists.txt)
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)

          LATEST_TAG=$(git tag -l "v${MAJOR}.${MINOR}.*-windows" --sort=-v:refname | head -n1)
          if [ -n "$LATEST_TAG" ]; then
            LAST_PATCH=$(echo "$LATEST_TAG" | sed "s/v${MAJOR}\.${MINOR}\.\([0-9]*\).*/\1/")
            NEXT_PATCH=$((LAST_PATCH + 1))
          else
            NEXT_PATCH=$(echo "$BASE" | cut -d. -f3)
          fi

          VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-windows" >> "$GITHUB_OUTPUT"
          echo "Next Windows release: v${VERSION}-windows"

      - name: Build Stremio (MSVC 2022 x86)
        shell: cmd
        run: |
          :: windows-2022 runner: VS 2022 Enterprise, Windows SDK 10.0.19041.0
          set PATH=C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x86\;C:\Qt\5.15.2\msvc2019\bin;%PATH%
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b 1

          if exist release rmdir /s /q release
          mkdir release
          pushd release
          cmake -G "NMake Makefiles" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="C:\Qt\5.15.2\msvc2019" ^
            -DOPENSSL_ROOT_DIR="%OPENSSL_ROOT_DIR%" ^
            -DQT_DEFAULT_MAJOR_VERSION=5 ^
            ..
          if errorlevel 1 exit /b 1
          cmake --build .
          if errorlevel 1 exit /b 1
          popd
          echo Build OK

      - name: Download server.js
        shell: pwsh
        run: |
          $url = (Get-Content server-url.txt).Trim()
          Write-Host "Downloading server.js from $url"
          Invoke-WebRequest $url -OutFile server.js

      - name: Assemble dist-win
        shell: cmd
        run: |
          if exist dist-win rmdir /s /q dist-win
          mkdir dist-win

          copy release\stremio.exe dist-win\
          copy windows\*.dll dist-win\
          copy windows\*.exe dist-win\
          copy windows\DS\DS.exe dist-win\
          copy windows\DS\Microsoft.Search.Interop.dll dist-win\ 2>nul
          if exist "C:\OpenSSL-Win32\bin\*.dll" copy "C:\OpenSSL-Win32\bin\*.dll" dist-win\
          if exist "%OPENSSL_ROOT_DIR%\bin\*.dll" copy "%OPENSSL_ROOT_DIR%\bin\*.dll" dist-win\
          call windows\generate_stremio-runtime.cmd dist-win
          copy server.js dist-win\

          set PATH=C:\Qt\5.15.2\msvc2019\bin;%PATH%
          windeployqt --release --no-compiler-runtime --qmldir=. dist-win\stremio.exe

          mkdir dist-win\DualSubtitles
          xcopy /s /e /i /y "DualSubtitles AddOn\index.js" dist-win\DualSubtitles\
          xcopy /s /e /i /y "DualSubtitles AddOn\package.json" dist-win\DualSubtitles\
          xcopy /s /e /i /y "DualSubtitles AddOn\src" dist-win\DualSubtitles\src\
          if exist "DualSubtitles AddOn\node_modules" xcopy /s /e /i /y "DualSubtitles AddOn\node_modules" dist-win\DualSubtitles\node_modules\
          copy windows\stremio-launch.bat dist-win\
          echo dist-win assembled

      - name: Build NSIS Installer
        shell: cmd
        run: |
          :: NSIS 3.10 is pre-installed on windows-2022 runner
          set package_version=${{ steps.version.outputs.version }}
          copy windows\NsProcess\Include\nsProcess.nsh "C:\Program Files (x86)\NSIS\Include\"
          copy windows\NsProcess\Plugin\x86-ansi\nsProcess.dll "C:\Program Files (x86)\NSIS\Plugins\x86-ansi\"
          copy windows\NsProcess\Plugin\x86-unicode\nsProcess.dll "C:\Program Files (x86)\NSIS\Plugins\x86-unicode\"
          makensis -V2 ./windows/installer/windows-installer.nsi
          if errorlevel 1 (
            echo NSIS installer build failed, continuing with ZIP only
          )
          exit /b 0

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist-win -DestinationPath "Stremio_${{ steps.version.outputs.version }}_windows.zip"
          Write-Host "Created Stremio_${{ steps.version.outputs.version }}_windows.zip"

      - name: Create tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          cat > release-notes.md << 'EOF'
          ## Stremio vVERSION_PLACEHOLDER — Windows (x86)

          ### Installation
          **Installer:** run `Stremio VERSION_PLACEHOLDER.exe`
          **Portable:** extract `Stremio_VERSION_PLACEHOLDER_windows.zip` and run `stremio.exe`
          Use `stremio-launch.bat` to also start the DualSubtitles addon automatically.

          ### What's included
          - Stremio shell (Qt5/WebEngine UI) compiled with MSVC 2019
          - Node.js streaming server (server.js)
          - DualSubtitles addon (dual subtitle support with independent styling)
          - MPV player with hardware decoding support

          ### DualSubtitles Addon
          1. Open Stremio -> Settings -> Addons
          2. Install via URL: `http://127.0.0.1:7000/manifest.json`
          3. The addon starts automatically when using `stremio-launch.bat`

          ### Requirements
          - Windows 10 or Windows 11 (64-bit)
          EOF
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" release-notes.md
          gh release create "${TAG}" \
            --title "Stremio v${VERSION} for Windows" \
            --notes-file release-notes.md \
            Stremio_${VERSION}_windows.zip \
            "Stremio ${VERSION}.exe" 2>/dev/null || \
          gh release create "${TAG}" \
            --title "Stremio v${VERSION} for Windows" \
            --notes-file release-notes.md \
            Stremio_${VERSION}_windows.zip
